lidar_type: 1 # Livox = 1, Ouster = 2, Velodyne = 3, XT32 = 4

offset:
  # Given transform is LiDAR -> Go2 IMU in row-vector homogeneous form;
  # values below are the equivalent column-vector form used by Elevator LIO.
  imu_t_lidar: [0.1870, 0.0, 0.0803]
  imu_R_lidar:
    - [0.9743701, 0.0, 0.2249511]
    - [0.0, 1.0, 0.0]
    - [-0.2249511, 0.0, 0.9743701]
  # Go2 body frame is the selected IMU frame, so this is LiDAR -> body.
  lidar_t_body: [-0.1641436, 0.0, -0.1203078]
  lidar_R_body:
    - [0.9743701, 0.0, -0.2249511]
    - [0.0, 1.0, 0.0]
    - [0.2249511, 0.0, 0.9743701]

topic_sub:
  lidar_topic_name: "/livox/lidar"
  imu_topic_name: "/go2/imu"
  wheel_topic_name: "/wheel_info" # Adapt receive_wheel if wheel odometry is used.
  elevator_flag_topic_name: "/LIO/set_elevator_flag"
